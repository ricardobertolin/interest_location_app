// Photo edits redraw the whole panel, and a card that jumped back to the top of
// the list after every removal would be unusable — hold the scroll where it was.
// Whichever view is up gets rebuilt, since photos show in all of them.
function refreshView(openId){
  const y=pbody.scrollTop;
  if(curView.kind==='country') renderCountry(curView.fid,openId);
  else if(curView.kind==='sites') renderSites();
  else renderOverview();
  pbody.scrollTop=y;
}
function wireCards(fid){
  const bySite=sel=>pbody.querySelectorAll(sel);
  // a step on a territory carries no site, so this redraws the page as a whole
  wireScales(b=>refreshView(b.dataset.site));
  bySite('.cardtop').forEach(t=>{
    t.onclick=ev=>{
      const cardEl=t.closest('.card'), id=cardEl.dataset.site;
      if(ev.target.dataset.chk){
        const r=rec(id); r.visited=!r.visited; save(); paint();
        cardEl.classList.toggle('done',!!r.visited);
        const c=document.getElementById('c-done');
        if(c) c.textContent=doneIn(fid);
        if(r.visited) toast('Marked visited');
        return;
      }
      // opening a card is a selection: the marker and its territory light up
      const opened=cardEl.classList.toggle('open');
      if(opened) focusSite(id);
      else if(sel.site===id){ sel.site=null; paint(); markCards(); }
    };
  });
  bySite('[data-note]').forEach(t=>{ t.onchange=t.onblur=()=>{ rec(t.dataset.note).notes=t.value; save(); }; });
  bySite('[data-photo]').forEach(b=>{
    b.onclick=()=>pbody.querySelector(`[data-file="${CSS.escape(b.dataset.photo)}"]`).click();
  });
  bySite('[data-file]').forEach(inp=>{
    inp.onchange=()=>{
      const id=inp.dataset.file;
      const queue=Array.from(inp.files||[]).filter(f=>!f.type||f.type.indexOf('image/')===0);
      inp.value='';                       // let the same picture be attached again later
      if(!queue.length) return;
      // Each picture is written to storage before the record points at it, so a
      // batch that runs out of room keeps the ones that did land instead of
      // leaving the newest few pointing at nothing.
      let added=0, failed=0;
      toast(queue.length===1?'Attaching…':'Attaching '+queue.length+' photos…');
      (function next(){
        const f=queue.shift();
        if(!f){
          if(added) save();
          refreshView(id);
          toast(!added?'Nothing could be stored'
            :(failed?added+' attached, '+failed+' failed'
                    :(added===1?'Photo attached':added+' photos attached')));
          return;
        }
        shrink(f,SHOT_MAX,d=>{
          if(!d){ failed++; return next(); }
          const pid=newPhotoId();
          storePhoto(pid,d).then(ok=>{
            if(ok){ (rec(id).photos=rec(id).photos||[]).push(pid); added++; } else failed++;
            next();
          });
        });
      })();
    };
  });
  bySite('[data-del]').forEach(b=>{
    b.onclick=ev=>{ ev.stopPropagation();
      if(dropPhoto(b.dataset.site,+b.dataset.del)) refreshView(b.dataset.site); };
  });
  bySite('[data-main]').forEach(b=>{
    b.onclick=ev=>{ ev.stopPropagation();
      if(setCover(b.dataset.site,+b.dataset.main)){
        refreshView(b.dataset.site); toast('Main photo set'); } };
  });
  bySite('[data-view]').forEach(img=>{
    img.onclick=ev=>{ ev.stopPropagation(); openLightbox(img.dataset.site,+img.dataset.view); };
  });
  bySite('[data-drop]').forEach(b=>{
    b.onclick=()=>{ const id=b.dataset.drop;
      if(!confirm('Delete this entry and everything attached to it?')) return;
      S.own=S.own.filter(x=>x.id!==id); delete S.places[id];
      if(sel.site===id) sel.site=null;
      sweepPhotos(); save(); drawSites(); paint(); renderCountry(fid); toast('Entry deleted'); };
  });
}
// Always answers, with null when the picture cannot be read, so a batch of
// attachments never stalls on one bad file.
function shrink(file,max,cb){
  const img=new Image(), fr=new FileReader();
  let done=false;
  const back=d=>{ if(!done){ done=true; cb(d); } };
  fr.onerror=()=>back(null);
  fr.onload=()=>{
    img.onerror=()=>back(null);
    img.onload=()=>{
      try{
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        back(c.toDataURL('image/jpeg',SHOT_Q));
      }catch(e){ back(null); }
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- lightbox ----------
   Opened from any thumbnail. Edits made here (main photo, removal) write
   straight through and re-render the panel underneath. */
const lbEl=document.getElementById('lightbox'), lbImg=document.getElementById('lb-img'),
      lbCount=document.getElementById('lb-count'), lbName=document.getElementById('lb-name'),
      lbMain=document.getElementById('lb-main'), lbDel=document.getElementById('lb-del'),
      lbPrev=document.getElementById('lb-prev'), lbNext=document.getElementById('lb-next');
let lb={site:null,i:0};
const lbOpen=()=>!lbEl.hidden;

function openLightbox(site,i){
  const ph=photosOf(site);
  if(!ph.length) return;
  lb={site,i:Math.max(0,Math.min(i|0,ph.length-1))};
  lbEl.hidden=false; drawLightbox();
}
function drawLightbox(){
  const ph=photosOf(lb.site);
  if(!ph.length){ closeLightbox(); return; }
  lb.i=Math.max(0,Math.min(lb.i,ph.length-1));
  const s=allSites().find(x=>x.id===lb.site), isMain=coverIdx(lb.site)===lb.i;
  const d=pix(ph[lb.i]);
  if(d) lbImg.src=d; else lbImg.removeAttribute('src');
  lbCount.textContent=(lb.i+1)+' / '+ph.length;
  lbName.textContent=(s?s.name:'')+(d?'':' — picture unavailable');
  lbMain.textContent=isMain?'✓ Main photo':'Set as main';
  lbMain.disabled=isMain||!d; lbMain.classList.toggle('on',isMain);
  lbPrev.disabled=lbNext.disabled=ph.length<2;
}
function closeLightbox(){
  if(lbEl.hidden) return;
  lbEl.hidden=true; lbImg.removeAttribute('src'); lb={site:null,i:0};
}
function lbStep(d){
  const n=photosOf(lb.site).length; if(n<2) return;
  lb.i=(lb.i+d+n)%n; drawLightbox();
}
// the panel behind holds the same photos, so it has to follow along
function lbRefresh(keepOpen){
  const site=lb.site, i=lb.i;
  refreshView(site);
  if(keepOpen){ lb.site=site; lb.i=i; drawLightbox(); } else closeLightbox();
}
lbPrev.onclick=()=>lbStep(-1);
lbNext.onclick=()=>lbStep(1);
document.getElementById('lb-close').onclick=closeLightbox;
document.getElementById('lb-shade').onclick=closeLightbox;
lbMain.onclick=()=>{ if(setCover(lb.site,lb.i)){ lbRefresh(true); toast('Main photo set'); } };
lbDel.onclick=()=>{
  const site=lb.site;
  if(!dropPhoto(site,lb.i)) return;
  const left=photosOf(site).length;
  if(left) lb.i=Math.min(lb.i,left-1);
  lbRefresh(left>0);
  toast(left?'Photo removed':'Photo removed — none left');
};
document.addEventListener('keydown',ev=>{
  if(!lbOpen()) return;
  if(ev.key==='Escape'){ ev.preventDefault(); closeLightbox(); }
  else if(ev.key==='ArrowLeft') lbStep(-1);
  else if(ev.key==='ArrowRight') lbStep(1);
});
// swipe between photos on a phone
let sx=0, sy=0, st=0;
lbEl.addEventListener('touchstart',ev=>{
  if(ev.touches.length!==1){ st=0; return; }
  sx=ev.touches[0].clientX; sy=ev.touches[0].clientY; st=Date.now();
},{passive:true});
lbEl.addEventListener('touchend',ev=>{
  if(!st||Date.now()-st>600) return;
  const t=ev.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  st=0;
  if(Math.abs(dx)>44&&Math.abs(dx)>Math.abs(dy)*1.6) lbStep(dx<0?1:-1);
},{passive:true});

/* ---------- save files ---------- */
function download(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function saveToFile(){
  download(new Blob([JSON.stringify(writeSave(),null,2)],{type:'application/json'}),
           (slug(S.name)||'atlas')+'.atlas.json');
  toast('Saved to file');
}

/* ---------------------------------------------------------------
   Bundles.
   A .json save carries photos as base64 inside the record, which makes
   them a third larger than they need to be and unreachable to anything
   that is not this app. A bundle is a zip holding the same save next to
   the pictures as actual files — cut to one size, one format and one
   naming pattern, so a folder of them is orderly enough to hand to a
   print shop or drop into a photo library. Opening a bundle here puts
   the pictures back where they came from.

   The zip is written entry by entry with no compression: JPEG and WebP
   are already compressed, and storing them plainly means the reader
   below needs no inflate to undo it. Anything compressed by another
   tool is still read, through the platform's own decompressor.
   --------------------------------------------------------------- */
const CRC_TABLE=(function(){
  const t=new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i;
    for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
    t[i]=c>>>0; }
  return t;
})();
function crc32(u8){
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=CRC_TABLE[(c^u8[i])&255]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function dosStamp(d){
  return {time:((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,
          date:(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF};
}
function zipBlob(entries){
  const enc=new TextEncoder(), body=[], dir=[], stamp=dosStamp(new Date());
  let off=0;
  entries.forEach(e=>{
    const name=enc.encode(e.name), data=e.data, crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true);
    lh.setUint16(6,0x0800,true);              // names are UTF-8
    lh.setUint16(8,0,true);                   // stored
    lh.setUint16(10,stamp.time,true); lh.setUint16(12,stamp.date,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    body.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,stamp.time,true); ch.setUint16(14,stamp.date,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true);
    ch.setUint32(42,off,true);
    dir.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  });
  const dirSize=dir.reduce((n,p)=>n+p.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);
  end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true);
  end.setUint32(12,dirSize,true); end.setUint32(16,off,true);
  return new Blob(body.concat(dir,[new Uint8Array(end.buffer)]),{type:'application/zip'});
}
// Reads the central directory backwards from the end marker, which is the only
// part of a zip whose position is known.
function zipList(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), dec=new TextDecoder();
  let p=-1;
  for(let i=buf.byteLength-22;i>=0&&i>=buf.byteLength-22-65535;i--)
    if(dv.getUint32(i,true)===0x06054b50){ p=i; break; }
  if(p<0) throw new Error('not a zip file');
  const n=dv.getUint16(p+10,true);
  let q=dv.getUint32(p+16,true);
  const out=[];
  for(let i=0;i<n;i++){
    if(q+46>buf.byteLength||dv.getUint32(q,true)!==0x02014b50) throw new Error('zip directory damaged');
    const method=dv.getUint16(q+10,true), csize=dv.getUint32(q+20,true);
    const nl=dv.getUint16(q+28,true), el=dv.getUint16(q+30,true), cl=dv.getUint16(q+32,true);
    const at=dv.getUint32(q+42,true);
    const name=dec.decode(u8.subarray(q+46,q+46+nl));
    const start=at+30+dv.getUint16(at+26,true)+dv.getUint16(at+28,true);
    out.push({name,method,data:u8.slice(start,start+csize)});
    q+=46+nl+el+cl;
  }
  return out;
}
function zipRead(e){
  if(e.method===0) return Promise.resolve(e.data);
  if(e.method!==8||typeof DecompressionStream!=='function')
    return Promise.reject(new Error('compressed entry cannot be read: '+e.name));
  return new Response(new Blob([e.data]).stream().pipeThrough(new DecompressionStream('deflate-raw')))
    .arrayBuffer().then(b=>new Uint8Array(b));
}

/* ---------- the picture template ---------- */
const EXT={'image/jpeg':'jpg','image/webp':'webp','image/png':'png'};
const BUNDLE={sites:'all',photos:'all',fmt:'image/jpeg',q:'0.82',size:'1600',shape:'as',
              grow:'no',name:'{country}/{site}-{n}'};
// Safari once returned a PNG from toDataURL for any type it did not know, so the
// chosen format is confirmed against what the canvas actually produces.
function canMake(type){
  try{
    const c=document.createElement('canvas'); c.width=c.height=1;
    return c.toDataURL(type).indexOf('data:'+type)===0;
  }catch(e){ return false; }
}
/* One photo, redrawn to the template. `shape` is either 'as' — keep the
   proportions it was shot at — or a target ratio, in which case the middle of
   the picture is taken and the rest dropped. */
function renderPhoto(src,opt){
  return new Promise(res=>{
    const img=new Image();
    img.onerror=()=>res(null);
    img.onload=()=>{
      try{
        const iw=img.width, ih=img.height;
        if(!iw||!ih) return res(null);
        let sx=0, sy=0, sw=iw, sh=ih;
        if(opt.shape!=='as'){
          const r=+opt.shape;
          if(iw/ih>r){ sw=Math.round(ih*r); sx=Math.round((iw-sw)/2); }
          else{ sh=Math.round(iw/r); sy=Math.round((ih-sh)/2); }
        }
        /* Enlarging adds no detail, only bytes, so by default a photo already
           smaller than the target is left at its own size. Ask for it and every
           file comes out at exactly the same dimensions instead. */
        const long=+opt.size||0, fit=long?long/Math.max(sw,sh):1;
        const sc=opt.grow==='yes'?fit:Math.min(1,fit);
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(sw*sc)); c.height=Math.max(1,Math.round(sh*sc));
        const g=c.getContext('2d');
        g.fillStyle='#000'; g.fillRect(0,0,c.width,c.height);
        g.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
        c.toBlob(b=>res(b),opt.fmt,opt.fmt==='image/png'?undefined:+opt.q);
      }catch(e){ res(null); }
    };
    img.src=src;
  });
}
function fillName(tpl,site,n,index,ext){
  const one=v=>slug(String(v==null?'':v))||'x';
  const out=String(tpl||BUNDLE.name).replace(/\{(\w+)\}/g,(all,tok)=>{
    if(tok==='country') return one(site.cname||site.country||'unplaced');
    if(tok==='site') return one(site.name);
    if(tok==='n') return String(n).padStart(2,'0');
    if(tok==='index') return String(index).padStart(3,'0');
    if(tok==='date') return new Date().toISOString().slice(0,10);
    if(tok==='atlas') return one(S.name);
    return '';
  })
  // a template can leave a stray separator behind; a path has to stay a path
  .split('/').map(p=>p.replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^[-.]+|[-.]+$/g,'')).filter(Boolean);
  return 'photos/'+(out.join('/')||'photo')+'.'+ext;
}
const csvCell=v=>{
  const s=String(v==null?'':v);
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
};

function buildBundle(opt,onStep){
  const enc=new TextEncoder(), ext=EXT[opt.fmt]||'jpg';
  const wanted=allSites().filter(s=>
    opt.sites==='done'?isDone(s.id):opt.sites==='pix'?photoCount(s.id)>0:true);
  // what to render, in the order the files will be numbered
  const jobs=[];
  wanted.forEach(s=>{
    if(opt.photos==='none') return;
    const ph=photosOf(s.id), ci=coverIdx(s.id);
    ph.forEach((pid,i)=>{
      if(opt.photos==='main'&&i!==ci) return;
      const data=pix(pid);
      if(data) jobs.push({site:s,i:i,cover:i===ci,data:data});
    });
  });
  const entries=[], rows=[['file','site','country','visited','main','latitude','longitude']
    .concat(S.scales.map(m=>m.label)).concat(['notes']).map(csvCell).join(',')];
  const taken=new Set(), placePhotos={};
  let n=0, failed=0;

  return jobs.reduce((chain,job,idx)=>chain.then(()=>{
    if(onStep) onStep(idx+1,jobs.length);
    return renderPhoto(job.data,opt).then(blob=>{
      if(!blob){ failed++; return null; }
      return blob.arrayBuffer().then(ab=>{
        const s=job.site;
        let name=fillName(opt.name,s,job.i+1,++n,ext), i=2;
        while(taken.has(name.toLowerCase())){
          name=name.replace(new RegExp('\\.'+ext+'$'),'-'+(i++)+'.'+ext);
        }
        taken.add(name.toLowerCase());
        entries.push({name:name,data:new Uint8Array(ab)});
        (placePhotos[s.id]=placePhotos[s.id]||[]).push({at:job.i,file:name,cover:job.cover});
        rows.push([name,s.name,s.cname||s.country,isDone(s.id)?'yes':'no',
          job.cover?'yes':'no',s.lat==null?'':s.lat,s.lng==null?'':s.lng]
          .concat(S.scales.map(m=>{ const v=sval(s,m.key); return v==null?'':levelText(m,v); }))
          .concat([(S.places[s.id]||{}).notes||''])
          .map(csvCell).join(','));
      });
    });
  }),Promise.resolve()).then(()=>{
    /* The save inside a bundle names its photos by file rather than carrying
       them, which is what makes the zip worth having. Sites left out by the
       filters keep their record; only the pictures they own are absent. */
    const places={};
    Object.keys(S.places).forEach(id=>{
      const r=S.places[id]; if(!r) return;
      const o={};
      if(r.visited) o.visited=true;
      if(r.notes) o.notes=r.notes;
      const kept=(placePhotos[id]||[]).sort((a,b)=>a.at-b.at);
      if(kept.length){
        o.photos=kept.map(p=>p.file);
        const c=kept.findIndex(p=>p.cover);
        o.cover=c<0?0:c;
      }
      if(Object.keys(o).length) places[id]=o;
    });
    const doc=writeSave(places);
    doc.bundle=true;
    entries.unshift({name:'atlas.json',data:enc.encode(JSON.stringify(doc,null,2))});
    if(n) entries.push({name:'photos.csv',data:enc.encode(rows.join('\r\n'))});
    entries.push({name:'README.txt',data:enc.encode(bundleReadme(opt,n,ext))});
    return {blob:zipBlob(entries),count:n,failed:failed};
  });
}
function bundleReadme(opt,n,ext){
  const shape=opt.shape==='as'?'as shot':opt.shape+':1 from the centre';
  return [S.name+(S.tagline?' — '+S.tagline:''),
    'Atlas bundle · '+new Date().toISOString().slice(0,10),
    '',
    'atlas.json   the whole atlas. Open it, or this .zip itself, in the app to',
    '             get everything back — progress, notes and photos included.',
    'photos/      '+n+' picture'+(n===1?'':'s')+', '+ext.toUpperCase()+', long edge '
      +(+opt.size?(opt.size+' px'+(opt.grow==='yes'?' exactly':' max')):'as stored')+', '+shape+'.',
    'photos.csv   one row per picture: site, country, coordinates, scales, notes.',
    '',
    'Naming pattern: '+(opt.name||BUNDLE.name),
    'Sites: '+(opt.sites==='done'?'visited only':opt.sites==='pix'?'those with photos':'all')
      +' · Photos: '+(opt.photos==='main'?'main only':opt.photos==='none'?'none':'every one'),
    '',
    'Written by Atlas '+APP_VERSION+' (save format v'+SAVE_VERSION+').'].join('\n');
}
function wireBundleForm(){
  const form=document.getElementById('x-form');
  const get=id=>document.getElementById(id);
  const fields={sites:'x-sites',photos:'x-photos',fmt:'x-fmt',q:'x-q',size:'x-size',shape:'x-shape',
                grow:'x-grow',name:'x-name'};
  Object.keys(fields).forEach(k=>{
    const el=get(fields[k]);
    el.value=BUNDLE[k];
    if(el.tagName==='SELECT'&&el.selectedIndex<0) el.value=BUNDLE[k]=blankDefault(k);
    el.onchange=()=>{ BUNDLE[k]=el.value; if(k==='fmt') noteFormat(); };
  });
  get('x-name').oninput=()=>{ BUNDLE.name=get('x-name').value; };
  function blankDefault(k){ return {sites:'all',photos:'all',fmt:'image/jpeg',q:'0.82',size:'1600',
                                   shape:'as',grow:'no'}[k]; }
  function noteFormat(){
    const el=get('x-note');
    el.textContent=BUNDLE.fmt==='image/webp'&&!canMake('image/webp')
      ? 'This browser cannot write WebP — pick JPEG or PNG.'
      : BUNDLE.fmt==='image/png'
        ? 'PNG keeps every pixel and ignores quality; the files are several times larger.'
        : 'Photos are stored at up to '+SHOT_MAX+' px, so a larger long edge will not add detail.';
  }
  noteFormat();
  get('a-bundle').onclick=()=>{ form.classList.add('open'); pbody.scrollTop=pbody.scrollHeight; };
  get('x-cancel').onclick=()=>form.classList.remove('open');
  get('x-go').onclick=()=>{
    if(BUNDLE.fmt!=='image/jpeg'&&!canMake(BUNDLE.fmt)){ toast('This browser cannot write that format'); return; }
    const go=get('x-go');
    go.disabled=true;
    toast('Building bundle…');
    buildBundle(BUNDLE,(i,total)=>{ if(total>4&&i%4===0) toast('Rendering '+i+' of '+total+'…'); })
      .then(r=>{
        download(r.blob,(slug(S.name)||'atlas')+'.atlas.zip');
        toast(r.failed?(r.count+' photos exported, '+r.failed+' failed')
                      :('Bundle saved · '+r.count+' photo'+(r.count===1?'':'s')+' · '+mb(r.blob.size)));
      })
      .catch(e=>{ console.error(e); toast('Bundle could not be built'); })
      .then(()=>{ const b=document.getElementById('x-go'); if(b) b.disabled=false; });
  };
}
// An opened file carries its pictures inline; they are moved into the photo
// store, and whatever the previous atlas held is released.
function applySave(o,msg){
  closeLightbox();
  S=readSave(o);
  adoptInline().then(sweepPhotos).then(()=>{
    save(); resolveSites(); drawSites(); paint(); brand();
    clearSel(); renderOverview(); openPanel(); toast(msg);
  }).catch(e=>{ console.error(e); toast('Atlas opened, but photos could not be stored');
    save(); resolveSites(); drawSites(); paint(); brand();
    clearSel(); renderOverview(); openPanel(); });
}
/* A bundle is unpacked back into an ordinary save: every photo path in the
   record is swapped for the picture the zip holds under that name, and from
   there it is opened like any other file. Files the zip is missing are dropped
   rather than left as broken references. */
function openBundle(buf){
  const list=zipList(buf);
  const byName=new Map(), byBase=new Map();
  list.forEach(e=>{
    byName.set(e.name.toLowerCase(),e);
    const base=e.name.split('/').pop().toLowerCase();
    if(!byBase.has(base)) byBase.set(base,e);
  });
  const jsons=list.filter(e=>/\.json$/i.test(e.name))
    .sort((a,b)=>(/^atlas\.json$/i.test(b.name)?1:0)-(/^atlas\.json$/i.test(a.name)?1:0));
  if(!jsons.length) throw new Error('no atlas file inside that bundle');
  return zipRead(jsons[0]).then(bytes=>{
    const doc=JSON.parse(new TextDecoder().decode(bytes));
    const p=(doc&&doc.progress&&typeof doc.progress==='object')?doc.progress:{};
    const places=(p.places&&typeof p.places==='object')?p.places:{};
    const jobs=[];
    Object.keys(places).forEach(id=>{
      const r=places[id];
      if(!r||!Array.isArray(r.photos)) return;
      r.photos.forEach((name,i)=>{
        if(typeof name!=='string'||name.slice(0,5)==='data:') return;
        const key=name.toLowerCase();
        const e=byName.get(key)||byBase.get(key.split('/').pop());
        jobs.push({rec:r,i:i,entry:e||null,name:name});
      });
    });
    return jobs.reduce((chain,j)=>chain.then(()=>{
      if(!j.entry){ j.rec.photos[j.i]=null; return null; }
      return zipRead(j.entry)
        .then(bytes2=>toDataURL(bytes2,j.name))
        .then(url=>{ j.rec.photos[j.i]=url; })
        .catch(e=>{ console.error(e); j.rec.photos[j.i]=null; });
    }),Promise.resolve()).then(()=>{
      // a photo that went missing must not take the main-photo pointer with it
      Object.keys(places).forEach(id=>{
        const r=places[id];
        if(!r||!Array.isArray(r.photos)) return;
        const at=Number.isInteger(r.cover)?r.cover:0;
        const kept=[];
        let cover=0;
        r.photos.forEach((u,i)=>{ if(!u) return; if(i===at) cover=kept.length; kept.push(u); });
        if(!kept.length){ delete r.photos; delete r.cover; }
        else{ r.photos=kept; r.cover=Math.min(cover,kept.length-1); }
      });
      return doc;
    });
  });
}
const MIME={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',
            avif:'image/avif',heic:'image/heic'};
function toDataURL(bytes,name){
  const ext=(name.split('.').pop()||'').toLowerCase();
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(fr.result);
    fr.onerror=()=>rej(fr.error||new Error('unreadable picture'));
    fr.readAsDataURL(new Blob([bytes],{type:MIME[ext]||'application/octet-stream'}));
  });
}
document.getElementById('openfile').onchange=function(){
  const f=this.files&&this.files[0];
  this.value='';   // let the same file be reopened later
  if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    const buf=fr.result, head=new Uint8Array(buf,0,Math.min(4,buf.byteLength));
    const isZip=head[0]===0x50&&head[1]===0x4B;
    try{
      if(isZip){
        toast('Unpacking bundle…');
        openBundle(buf).then(doc=>applySave(doc,'Bundle opened'))
          .catch(e=>{ console.error(e); toast('That bundle could not be read'); });
      } else {
        applySave(JSON.parse(new TextDecoder().decode(buf)),'Atlas opened');
      }
    }catch(e){ toast('Not a valid atlas file'); console.error(e); }
  };
  fr.onerror=()=>toast('Could not read that file');
  fr.readAsArrayBuffer(f);
};
function copyReport(){
  const cv=visitedFeatures().map(f=>f.properties.name);
  const done=allSites().filter(s=>isDone(s.id));
  const marks=s=>{
    const t=siteScales().map(m=>{ const v=sval(s,m.key); return v==null?'':m.label+' '+levelText(m,v); })
      .filter(Boolean).join(', ');
    return t?' — '+t:'';
  };
  const t=[S.name.toUpperCase()+(S.tagline?' — '+S.tagline.toUpperCase():''),'',
    `Territories visited: ${cv.length} of ${features.length}`,cv.join(', ')||'—','',
    `Sites visited: ${done.length}`,
    ...done.map(s=>`· ${s.name} (${s.cname||s.country})${marks(s)}`)].join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject())
    .then(()=>toast('Report copied')).catch(()=>toast('Copy unavailable'));
}
let tt;
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),1900); }

/* ---------- PWA ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let prompt_;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); prompt_=e;
  const b=document.getElementById('btn-install'); b.style.display='inline-block';
  b.onclick=()=>{ prompt_.prompt(); prompt_=null; b.style.display='none'; }; });
window.addEventListener('appinstalled',()=>{
  prompt_=null; document.getElementById('btn-install').style.display='none'; toast('Installed');
});
})();
</script>
