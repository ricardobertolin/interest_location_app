<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Atlas — Site Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
:root{
  --ink:#080b0e; --ink2:#0d1216; --panel:#0f1519; --line:#1e272d; --line2:#2a353c;
  --land:#161d22; --land-hi:#212c33; --visited:#17383a; --visited-line:#3f8f8c;
  --cyan:#5fe0d8; --cyan-dim:#2f6f6b; --bone:#e6e1d2; --dim:#7a878e; --rust:#c2553a;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --serif:'Instrument Serif',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink)}
body{font-family:var(--mono);color:var(--bone);font-size:13px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
a{color:var(--cyan);text-decoration:none;border-bottom:1px solid var(--cyan-dim)}
a:hover{color:#8ff3ec;border-bottom-color:var(--cyan)}
button{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  background:transparent;color:var(--bone);border:1px solid var(--line2);padding:7px 11px;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s}
button:hover{border-color:var(--cyan-dim);color:var(--cyan)}
button:disabled{opacity:.4;cursor:default}
input,textarea{font-family:var(--mono);font-size:12.5px;color:var(--bone);background:#0a0f12;
  border:1px solid var(--line2);padding:8px 9px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--cyan-dim)}
::placeholder{color:#4d585e}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#222d34}
::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--ink2);padding-top:calc(10px + env(safe-area-inset-top))}
.mark{display:flex;align-items:baseline;gap:9px;min-width:0}
.mark h1{font-family:var(--serif);font-size:22px;font-weight:400;margin:0;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.mark span{font-size:9.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.eye{width:16px;height:16px;flex:none;align-self:center}
.hstats{display:flex;gap:14px;margin-left:auto;align-items:center}
.hstat{font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.hstat b{font-family:var(--serif);font-size:19px;color:var(--cyan);font-weight:400;letter-spacing:0;margin-right:5px}
.hbtns{display:flex;gap:7px;margin-left:6px}

main{display:grid;grid-template-columns:1fr 400px;min-height:0}
#mapwrap{position:relative;overflow:hidden;background:
  radial-gradient(120% 100% at 50% 0%,#0b1114 0%,var(--ink) 70%)}
#mapwrap::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(95,224,216,.028) 0 1px,transparent 1px 3px)}
svg#map{display:block;width:100%;height:100%;cursor:grab}
svg#map.grabbing{cursor:grabbing}
svg#map.picking{cursor:crosshair}
.country{fill:var(--land);stroke:#0a0f12;stroke-width:.4;vector-effect:non-scaling-stroke;transition:fill .18s}
.country:hover{fill:var(--land-hi)}
.country.visited{fill:var(--visited)}
.country.visited:hover{fill:#1e474a}
.country.sel{fill:#28383f;stroke:var(--cyan);stroke-width:1.3}
.country.visited.sel{fill:#215052}
.site{cursor:pointer}
.site circle{fill:#0a0f12;stroke:var(--dim);stroke-width:1.2;vector-effect:non-scaling-stroke}
.site.done circle{fill:var(--cyan);stroke:var(--cyan)}
.site.own circle{stroke:var(--rust)}
.site.own.done circle{fill:var(--rust);stroke:var(--rust)}
.site.sel circle{stroke:var(--cyan)}
.site .halo{fill:none;stroke:var(--cyan);opacity:0}
/* A site picked from a list has to be findable on the map, so the selected
   marker keeps a solid ring and throws a slow pulse out from it. */
.site.sel .halo{opacity:.9;animation:ping 1.9s ease-out infinite}
@keyframes ping{0%{r:6px;opacity:.9}70%{opacity:0}100%{r:17px;opacity:0}}
@media (prefers-reduced-motion:reduce){.site.sel .halo{animation:none;opacity:.7}}
#tip{position:absolute;pointer-events:none;background:#0b1114ee;border:1px solid var(--line2);
  padding:5px 8px;font-size:11px;letter-spacing:.05em;white-space:nowrap;opacity:0;transition:opacity .12s;
  text-transform:uppercase;transform:translate(-50%,-160%)}
#tip small{color:var(--dim);text-transform:none;letter-spacing:.03em}
#zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
#zoomctl button{width:34px;height:34px;padding:0;font-size:14px;background:#0b1114cc}
#legend{position:absolute;left:14px;bottom:12px;display:flex;flex-direction:column;gap:5px;
  font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
#legend div{display:flex;align-items:center;gap:7px}
.swatch{width:9px;height:9px;flex:none;border:1px solid var(--dim)}
.swatch.v{background:var(--visited);border-color:var(--visited-line)}
.swatch.c{background:var(--cyan);border-color:var(--cyan);border-radius:50%}
.swatch.u{background:#0a0f12;border-radius:50%}
.swatch.o{background:transparent;border-color:var(--rust);border-radius:50%}

#panel{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.ptop{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);flex:none}
.ptop .kicker{font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.ptop .x{margin-left:auto}
#pbody{overflow-y:auto;padding:14px;flex:1;min-height:0}
.handle{display:none}

h2.dossier{font-family:var(--serif);font-size:30px;font-weight:400;margin:0 0 2px;line-height:1.08}
.meta{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.bigbtn{width:100%;padding:11px;margin-bottom:16px;letter-spacing:.14em}
.bigbtn.on{border-color:var(--visited-line);color:var(--cyan);background:#12262880}
.rule{height:1px;background:var(--line);margin:16px 0}
.sechead{font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;
  display:flex;align-items:center;gap:9px;margin:0 0 10px}
.sechead::after{content:'';flex:1;height:1px;background:var(--line)}

.card{border:1px solid var(--line);background:#0b1013;margin-bottom:9px}
.card.done{border-color:#254a4a}
.card.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan-dim)}
.card.sel .cardname{color:var(--cyan)}
.cardtop{display:flex;gap:10px;padding:10px 11px;cursor:pointer;align-items:flex-start}
.cardtop:hover{background:#0f171b}
.chk{width:15px;height:15px;flex:none;margin-top:2px;border:1px solid var(--line2);
  display:grid;place-items:center;font-size:10px;color:transparent}
.done .chk{border-color:var(--cyan);background:var(--cyan);color:#06272a}
.cardname{font-family:var(--serif);font-size:18px;line-height:1.15;margin:0 0 1px}
.hook{color:var(--dim);font-size:11.5px;line-height:1.45;text-wrap:pretty}
.cardbody{padding:0 11px 12px 36px;display:none}
.card.open .cardbody{display:block}
.lore{font-size:12px;line-height:1.62;color:#b9bfc2;text-wrap:pretty;margin:2px 0 10px}
.coords{font-size:10px;letter-spacing:.1em;color:var(--cyan-dim);text-transform:uppercase;margin-bottom:10px}
.fieldlabel{font-size:9.5px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:5px}
/* the main photo, shown at the head of an open site */
.hero{position:relative;margin:0 0 12px;border:1px solid var(--line2);background:#0a0f12;overflow:hidden}
.hero img{display:block;width:100%;height:190px;object-fit:cover;cursor:zoom-in;
  filter:grayscale(.2) contrast(1.05);transition:filter .25s,transform .4s}
.hero:hover img{filter:none;transform:scale(1.02)}
.hero figcaption{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;
  padding:14px 9px 6px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(transparent,#050809e6);pointer-events:none}
.hero figcaption b{color:var(--cyan);font-weight:400}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;margin:9px 0}
.photos figure{position:relative;margin:0;aspect-ratio:1;overflow:hidden;border:1px solid var(--line)}
.photos figure.main{border-color:var(--visited-line)}
.photos img{display:block;width:100%;height:100%;object-fit:cover;cursor:zoom-in;
  filter:grayscale(.45) contrast(1.1);transition:filter .2s,transform .35s}
.photos figure:hover img{filter:none;transform:scale(1.06)}
.photos .badge{position:absolute;left:0;bottom:0;padding:2px 5px;background:#0b1114d9;color:var(--cyan);
  font-size:8px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;pointer-events:none}
.pacts{position:absolute;top:3px;right:3px;display:flex;gap:3px;opacity:0;transition:opacity .15s}
.photos figure:hover .pacts,.photos figure:focus-within .pacts{opacity:1}
.pacts button{width:21px;height:21px;padding:0;font-size:10px;line-height:1;background:#0b1114e6}
@media (hover:none){.pacts{opacity:1}}

.rowthumb{width:30px;height:30px;flex:none;object-fit:cover;align-self:center;
  border:1px solid var(--line2);filter:grayscale(.4) contrast(1.1)}
.cardthumb{width:44px;height:44px;flex:none;margin-left:auto;object-fit:cover;
  border:1px solid var(--line2);filter:grayscale(.4) contrast(1.1)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center}
.lb[hidden]{display:none}
.lb-shade{position:absolute;inset:0;background:#040709f2}
.lb-frame{position:relative;margin:0;padding:0 56px;max-width:100vw;
  max-height:calc(100% - 72px - env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
.lb-frame img{max-width:100%;max-height:calc(100vh - 130px);display:block;object-fit:contain;
  border:1px solid var(--line2);background:#0a0f12}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:54px;padding:0;
  font-size:20px;background:#0b1114cc;z-index:2}
.lb-nav[disabled]{opacity:.2}
#lb-prev{left:10px}
#lb-next{right:10px}
.lb-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;
  padding:11px 13px calc(11px + env(safe-area-inset-bottom));
  background:#080b0eee;border-top:1px solid var(--line)}
.lb-count{font-size:10px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase;white-space:nowrap}
.lb-name{flex:1;min-width:0;font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-bar button{background:#0b1114}
.lb-bar button.on{border-color:var(--visited-line);color:var(--cyan)}
.rowbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tiny{font-size:9.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.missing{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:8px;
  letter-spacing:.14em;text-transform:uppercase;color:#4d585e;background:#0a0f12}

/* ---- every site on file, as a gallery ---- */
.galbar{display:flex;gap:6px;margin-bottom:9px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:13px}
.chip{padding:5px 9px;font-size:9.5px}
.chip.on{border-color:var(--visited-line);color:var(--cyan);background:#12262880}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.galcard{margin:0;border:1px solid var(--line);background:#0b1013;cursor:pointer;
  display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.galcard:hover{border-color:var(--cyan-dim)}
.galcard.done{border-color:#254a4a}
.galcard.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan-dim)}
.galshot{position:relative;aspect-ratio:4/3;background:#0a0f12;overflow:hidden;flex:none}
.galshot img{display:block;width:100%;height:100%;object-fit:cover;cursor:zoom-in;
  filter:grayscale(.35) contrast(1.08);transition:filter .2s,transform .35s}
.galcard:hover .galshot img{filter:none;transform:scale(1.05)}
.galnone{position:absolute;inset:0;display:grid;place-items:center;font-size:8.5px;letter-spacing:.18em;
  text-transform:uppercase;color:#3f4a50}
.galtick{position:absolute;top:4px;left:4px;width:17px;height:17px;display:grid;place-items:center;
  background:var(--cyan);color:#06272a;font-size:10px}
.galtick.own{background:var(--rust);color:#1b0a06}
.galcount{position:absolute;right:0;bottom:0;padding:2px 5px;background:#0b1114d9;color:var(--cyan);
  font-size:8px;letter-spacing:.16em;text-transform:uppercase}
.galcap{padding:7px 8px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.galname{font-family:var(--serif);font-size:15px;line-height:1.16;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.galsub{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.meter{height:3px;background:#161e22;margin:6px 0 0;overflow:hidden}
.meter i{display:block;height:100%;background:var(--cyan-dim);transition:width .4s}
.meter i.hot{background:var(--rust)}

/* ---- scales: a numbered value a site or a country can carry ---- */
.scale{margin:0 0 11px}
.scalehead{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.scaleval{margin-left:auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
.scaleval.off{color:#4d585e}
.steps{display:flex;gap:4px}
.steps button{flex:1;padding:6px 0;font-size:11px;letter-spacing:.04em;min-width:0}
.steps button.on{border-color:var(--cyan);color:var(--cyan);background:#12262880}
.steps button.clear{flex:0 0 34px;color:var(--dim)}
.pips{display:inline-flex;gap:2.5px;align-items:center;vertical-align:middle}
.pips i{width:5px;height:5px;border:1px solid var(--cyan-dim);border-radius:50%}
.pips i.on{background:var(--cyan);border-color:var(--cyan)}
.pips.hot i.on{background:var(--rust);border-color:var(--rust)}
.pips.hot i{border-color:#7a3729}
.galtag{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim)}
.scaletag{position:absolute;right:4px;top:4px;display:flex;gap:2.5px;padding:3px 4px;
  background:#0b1114d9;align-items:center}
.scaletag i{width:5px;height:5px;border:1px solid var(--cyan-dim);border-radius:50%}
.scaletag i.on{background:var(--cyan);border-color:var(--cyan)}
.scaletag.hot i.on{background:var(--rust);border-color:var(--rust)}
.lvlrow{display:flex;align-items:center;gap:9px;padding:5px 2px;font-size:10.5px;letter-spacing:.04em}
.lvlrow .lvln{color:var(--dim);text-transform:uppercase;font-size:9.5px;letter-spacing:.14em;
  min-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvlrow .lvlbar{flex:1;height:3px;background:#161e22;overflow:hidden}
.lvlrow .lvlbar i{display:block;height:100%;background:var(--cyan-dim)}
.lvlrow em{font-style:normal;color:var(--dim);font-size:10px;min-width:42px;text-align:right}
.scaledef{display:flex;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.scaledef input{flex:1}
.scaledef .tiny{white-space:nowrap}
select{font-family:var(--mono);font-size:11.5px;color:var(--bone);background:#0a0f12;
  border:1px solid var(--line2);padding:7px 8px;width:100%}
select:focus{outline:none;border-color:var(--cyan-dim)}
.two3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:16px}
.statgrid div{background:#0b1013;padding:12px}
.statgrid b{display:block;font-family:var(--serif);font-size:32px;font-weight:400;color:var(--cyan);line-height:1}
.bar{height:3px;background:#161e22;margin:0 0 16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan);transition:width .4s}
.listrow{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.listrow:hover{background:#0f171b}
.listrow em{margin-left:auto;font-style:normal;color:var(--dim);font-size:10.5px;letter-spacing:.08em}
.empty{color:var(--dim);font-size:11.5px;line-height:1.6;text-wrap:pretty}
.form{border:1px solid var(--line2);background:#0b1013;padding:12px;margin-bottom:14px;display:none}
.form.open{display:block}
.form label{display:block;margin-bottom:9px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:10.5px;color:var(--dim);letter-spacing:.03em;margin-top:7px;line-height:1.5}
#a-version{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;color:#5a666c}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#0b1114;
  border:1px solid var(--cyan-dim);color:var(--cyan);padding:9px 14px;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  header{padding:9px 12px;gap:10px;padding-top:calc(9px + env(safe-area-inset-top))}
  .mark h1{font-size:18px;max-width:38vw}
  .mark span{display:none}
  .hstat{font-size:9px}.hstat b{font-size:15px}
  .hbtns{gap:5px;margin-left:4px}
  .hbtns button{padding:7px 8px;letter-spacing:.05em}
  .gal{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  main{grid-template-columns:1fr;grid-template-rows:1fr;position:relative}
  #panel{position:absolute;left:0;right:0;bottom:0;top:auto;height:58%;z-index:20;
    border-left:none;border-top:1px solid var(--line2);box-shadow:0 -18px 40px #000a;
    transform:translateY(calc(100% - 46px));transition:transform .3s cubic-bezier(.3,.8,.3,1)}
  #panel.open{transform:translateY(0)}
  #panel.tall{height:88%}
  .handle{display:flex;align-items:center;justify-content:center;gap:9px;height:46px;flex:none;
    cursor:pointer;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim)}
  .handle b{color:var(--bone);font-weight:400}
  .handle::before{content:'';width:26px;height:2px;background:var(--line2);position:absolute;top:7px;left:50%;
    transform:translateX(-50%)}
  #pbody{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  #legend{display:none}
  #zoomctl{bottom:auto;top:12px}
  .hero img{height:160px}
  .lb-frame{padding:0 44px}
  .lb-nav{width:32px;height:48px;font-size:18px}
  #lb-prev{left:4px}
  #lb-next{right:4px}
  .lb-name{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="#5fe0d8" stroke-width="1.4">
      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3.2" fill="#5fe0d8" stroke="none"/>
    </svg>
    <div class="mark"><h1 id="a-name">Atlas</h1><span id="a-tag">Site Log</span></div>
    <div class="hstats">
      <div class="hstat"><b id="s-countries">0</b>Countries</div>

        <div><i class="swatch c"></i>Visited site</div>

  <button class="lb-nav" id="lb-next" title="Next photo">›</button>

    <span class="lb-count" id="lb-count">1 / 1</span>
    <span class="lb-name" id="lb-name"></span>

    <button id="lb-del">Remove</button>

  </div>
</div>
<div id="toast"></div>
<input type="file" id="openfile" accept="application/json,.json,application/zip,.zip" style="display:none">

<script>
(function(){
'use strict';

/* ---------------------------------------------------------------
   The app itself is unbranded: an empty globe you log places on.
   A name, a tagline and a catalogue of sites all live in the save
   file, so any themed atlas is just one save among any others.
   --------------------------------------------------------------- */

const KEY='atlas-v1';
const APP_VERSION='1.3.0';        // shown in the overview; bump with sw.js CACHE
const SAVE_VERSION=3;             // 2 added the main-photo pointer; 3 adds scales
const DEFAULT_NAME='Atlas', DEFAULT_TAG='Site Log';
/* What an attached photo is kept at. Large enough that an exported bundle has
   real pictures in it rather than thumbnails, small enough that a few hundred
   still fit in a browser's store. */
const SHOT_MAX=1600, SHOT_Q=.74;

const norm=s=>String(s).toLowerCase().replace(/[^a-z]/g,'');
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const siteId=(country,name)=>slug(country||'')+'/'+slug(name||'');

const ALIAS={
  unitedstatesofamerica:['unitedstates','usa','us'], unitedkingdom:['uk','greatbritain','britain'],
  czechia:['czechrep','czechrepublic'], russia:['russianfederation'],
  bosniaandherzegovina:['bosniaandherz','bosniaherz','bosnia'],
  northkorea:['demrepkorea','dprk'], southkorea:['korea','repofkorea'],
  laos:['laopdr'], myanmar:['burma'], vietnam:['vietnam'],
  papuanewguinea:['papuanewguinea'], centralafricanrepublic:['centralafricanrep']
};

/* ---------- state ---------- */
/* Territory values whose country the map has not matched yet — see readTerr.
   They belong to whatever atlas is loaded, so an empty atlas empties them too. */
let terrPending=[];
const blank=()=>{
  terrPending=[];
  return {name:DEFAULT_NAME,tagline:DEFAULT_TAG,scales:[],sites:[],
          countries:{},places:{},own:[],terr:{}};
};
let S=blank();

const num=v=>{const n=parseFloat(v); return isFinite(n)?n:null;};
const str=(v,d)=>typeof v==='string'?v:(d===undefined?'':d);
// Saves written before the unnumbered territories got ids of their own carry
// the literal string "undefined" as a country reference; it names nothing now.
const fidOf=v=>{ const s=v==null?'':String(v);
  return (!s||s==='undefined'||s==='null')?null:s; };

/* ---------------------------------------------------------------
   Scales.
   A scale is a numbered judgement an atlas puts on a place — how hard
   it is to reach, how good it was, how much it cost. The atlas defines
   the scales; sites and territories carry a value on each. Values are
   read even when no scale claims them, so a scale deleted by accident
   and added back finds its numbers still there.
   --------------------------------------------------------------- */
const MAX_SCALES=6, MAX_STEPS=10;
function readScales(arr){
  if(!Array.isArray(arr)) return [];
  const seen=new Set();
  return arr.map(m=>{
    if(!m||typeof m!=='object') return null;
    const label=str(m.label).trim()||str(m.key).trim();
    let key=slug(str(m.key))||slug(label);
    if(!key||!label) return null;
    while(seen.has(key)) key+='-2';
    seen.add(key);
    let min=num(m.min), max=num(m.max);
    min=Math.max(0,Math.min(9,min==null?1:Math.round(min)));
    max=max==null?min+4:Math.round(max);
    max=Math.max(min+1,Math.min(max,min+MAX_STEPS-1));
    const levels=(Array.isArray(m.levels)?m.levels:[]).map(x=>str(x).trim()).slice(0,max-min+1);
    const scope=['site','country','both'].indexOf(str(m.scope))>=0?str(m.scope):'both';
    return {key,label,min,max,levels,scope};
  }).filter(Boolean).slice(0,MAX_SCALES);
}
function readValues(o){
  const out={};
  if(!o||typeof o!=='object'||Array.isArray(o)) return out;
  Object.keys(o).forEach(k=>{
    const key=slug(k), n=num(o[k]);
    if(key&&n!=null) out[key]=Math.round(n);
  });
  return out;
}
const someValues=v=>Object.keys(v).length?v:undefined;

function readSites(arr){
  if(!Array.isArray(arr)) return [];
  const seen=new Set();
  return arr.map(r=>{
    // accept both the object form and the older [country,name,hook,lore,lat,lng] tuple
    const o=Array.isArray(r)
      ? {country:r[0],name:r[1],hook:r[2],lore:r[3],lat:r[4],lng:r[5]}
      : (r&&typeof r==='object'?r:null);
    if(!o||!str(o.name).trim()) return null;
    let id=str(o.id).trim()||siteId(o.country,o.name);
    while(seen.has(id)) id+='-2';
    seen.add(id);
    return {id,country:str(o.country),name:str(o.name),hook:str(o.hook),
            lore:str(o.lore),lat:num(o.lat),lng:num(o.lng),
            values:readValues(o.values),own:false};
  }).filter(Boolean);
}
function readOwn(arr){
  if(!Array.isArray(arr)) return [];
  return arr.map(o=>{
    if(!o||typeof o!=='object'||!str(o.name).trim()) return null;
    return {id:str(o.id).trim()||('o'+Date.now()+Math.random().toString(36).slice(2,6)),
            country:str(o.country),cname:str(o.cname),fid:fidOf(o.fid),
            name:str(o.name),hook:str(o.hook),lore:str(o.lore),
            lat:num(o.lat),lng:num(o.lng),values:readValues(o.values),own:true};
  }).filter(Boolean);
}
/* Territory values arrive named by country, because a file has to survive a
   change of map dataset — the numeric ids do not travel, the names do. They are
   bound to a territory in resolveTerr, once the map is up; anything the map
   cannot match waits in terrPending and is written back out untouched. */
function readTerr(arr){
  if(!Array.isArray(arr)) return [];
  return arr.map(t=>{
    if(!t||typeof t!=='object') return null;
    const values=readValues(t.values);
    if(!Object.keys(values).length) return null;
    return {country:str(t.country),fid:fidOf(t.fid),values};
  }).filter(Boolean);
}
function resolveTerr(){
  if(!features.length) return;
  const known=new Set(features.map(f=>String(f.id)));
  const left=[];
  terrPending.forEach(t=>{
    const f=t.country?lookup(t.country):null;
    const fid=f?String(f.id):(known.has(t.fid)?t.fid:null);
    if(!fid){ left.push(t); return; }
    const cur=S.terr[fid]||(S.terr[fid]={});
    Object.keys(t.values).forEach(k=>{ cur[k]=t.values[k]; });
  });
  terrPending=left;
}
function writeTerr(){
  const out=[];
  Object.keys(S.terr).forEach(fid=>{
    const v=S.terr[fid];
    if(!v||!Object.keys(v).length) return;
    const f=featureOf(fid);
    out.push({country:f?f.properties.name:'',fid:fid,values:v});
  });
  return out.concat(terrPending);
}
function readSave(o){
  if(!o||typeof o!=='object') throw new Error('not an atlas file');
  const p=(o.progress&&typeof o.progress==='object')?o.progress:{};
  const obj=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
  terrPending=readTerr(o.territories);
  return {
    name:str(o.name).trim()||DEFAULT_NAME,
    tagline:str(o.tagline).trim(),
    scales:readScales(o.scales),
    sites:readSites(o.sites),
    countries:obj(p.countries),
    places:obj(p.places),
    own:readOwn(p.own),
    terr:{}
  };
}
/* The file written out for the user: photos travel inside it as data URLs, so
   one file is still the whole atlas and opens anywhere. */
const outSite=s=>({id:s.id,country:s.country,name:s.name,hook:s.hook,
  lore:s.lore,lat:s.lat,lng:s.lng,values:someValues(s.values||{})});
const outOwn=s=>({id:s.id,country:s.country,cname:s.cname,fid:s.fid,name:s.name,
  hook:s.hook,lore:s.lore,lat:s.lat,lng:s.lng,values:someValues(s.values||{})});
function writeSave(places){
  return {format:'atlas-save',version:SAVE_VERSION,app:APP_VERSION,name:S.name,tagline:S.tagline,
    scales:S.scales,territories:writeTerr(),sites:S.sites.map(outSite),
    progress:{countries:S.countries,places:places||inlinePlaces(),own:S.own.map(outOwn)}};
}
function inlinePlaces(){
  const out={};
  Object.keys(S.places).forEach(id=>{
    const r=S.places[id]; if(!r) return;
    const o={};
    if(r.visited) o.visited=true;
    if(r.notes) o.notes=r.notes;
    const ids=Array.isArray(r.photos)?r.photos:[], ci=coverIdx(id), keep=[];
    let cover=0;
    ids.forEach((pid,i)=>{ const d=pix(pid); if(!d) return;
      if(i===ci) cover=keep.length; keep.push(d); });
    if(keep.length){ o.photos=keep; o.cover=cover; }
    if(Object.keys(o).length) out[id]=o;
  });
  return out;
}

/* ---------------------------------------------------------------
   Storage.
   Photos are almost all of an atlas by weight, and localStorage tops
   out near 5 MB — past twenty or so pictures its write throws, and every
   edit made after that was lost on the next visit, newest first. The
   record now lives in IndexedDB with each photo on its own key, so
   there is room for hundreds and typing a note no longer rewrites a
   pile of pictures. localStorage remains only as a fallback for
   browsers without IndexedDB, and as the source of a one-off handover.
   --------------------------------------------------------------- */
const DB_NAME='atlas-db', DB_VER=1, ST='state', PH='photos', STATE_KEY='main';
let db=null, noDB=false;

function openDB(){
  return new Promise((res,rej)=>{
    let rq;
    try{ rq=indexedDB.open(DB_NAME,DB_VER); }catch(e){ return rej(e); }
    rq.onupgradeneeded=()=>{ const d=rq.result;
      if(!d.objectStoreNames.contains(ST)) d.createObjectStore(ST);
      if(!d.objectStoreNames.contains(PH)) d.createObjectStore(PH); };
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error||new Error('open failed'));
    rq.onblocked=()=>rej(new Error('blocked'));
  });
}
function tx(store,mode,fn){
  return new Promise((res,rej)=>{
    if(!db) return rej(new Error('no database'));
    let t;
    try{ t=db.transaction(store,mode); }catch(e){ return rej(e); }
    let out;
    try{ out=fn(t.objectStore(store)); }catch(e){ try{t.abort();}catch(_){} return rej(e); }
    t.oncomplete=()=>res(out&&'result' in out?out.result:out);
    t.onerror=()=>rej(t.error||new Error('transaction failed'));
    t.onabort=()=>rej(t.error||new Error('transaction aborted'));
  });
}
const idbPut=(s,k,v)=>tx(s,'readwrite',o=>o.put(v,k));
const idbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const idbGet=(s,k)=>tx(s,'readonly',o=>o.get(k));

/* ---------- photos ----------
   A record holds photo ids in order and points at one of them with `cover`,
   the photo shown wherever the site is presented. Older saves have no pointer,
   so the first photo stands in until one is chosen. The picture data itself
   sits in PIX, filled from the database once at start-up so every render stays
   synchronous. */
const PIX=new Map();
let pixSeq=0;
const newPhotoId=()=>'p'+Date.now().toString(36)+(pixSeq++).toString(36)+Math.random().toString(36).slice(2,6);
const pix=id=>PIX.get(id)||'';

function loadPhotos(){
  return new Promise((res,rej)=>{
    let t;
    try{ t=db.transaction(PH,'readonly'); }catch(e){ return rej(e); }
    const rq=t.objectStore(PH).openCursor();
    rq.onsuccess=()=>{ const c=rq.result; if(!c) return; PIX.set(String(c.key),c.value); c.continue(); };
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error||new Error('photo read failed'));
  });
}
// Writes the picture before anything points at it, so a record never names a
// photo the database does not hold.
function storePhoto(id,data){
  if(noDB){ PIX.set(id,data); return Promise.resolve(true); }
  return idbPut(PH,id,data).then(()=>{ PIX.set(id,data); return true; })
    .catch(e=>{ console.error(e); return false; });
}
function photosOf(id){ const r=S.places[id]; return (r&&Array.isArray(r.photos))?r.photos:[]; }
function coverIdx(id){
  const ph=photosOf(id); if(!ph.length) return -1;
  const c=S.places[id].cover;
  return (Number.isInteger(c)&&c>=0&&c<ph.length)?c:0;
}
function coverSrc(id){ const i=coverIdx(id); return i<0?'':pix(photosOf(id)[i]); }
function photoCount(id){ return photosOf(id).filter(p=>pix(p)).length; }
function setCover(id,i){
  const ph=photosOf(id); if(i<0||i>=ph.length) return false;
  rec(id).cover=i; save(); return true;
}
function dropPhoto(id,i){
  const r=rec(id), ph=r.photos||[];
  if(i<0||i>=ph.length) return false;
  const gone=ph.splice(i,1)[0];
  if(!ph.length){ delete r.photos; delete r.cover; }
  else{
    let c=Number.isInteger(r.cover)?r.cover:0;
    if(c===i) c=0; else if(c>i) c--;
    r.cover=Math.max(0,Math.min(c,ph.length-1));
  }
  save(); forgetPhoto(gone); return true;
}
function forgetPhoto(pid){
  if(!pid||usedPhotoIds().has(pid)) return;
  PIX.delete(pid);
  if(!noDB) idbDel(PH,pid).catch(e=>console.error(e));
}
function usedPhotoIds(){
  const set=new Set();
  Object.keys(S.places).forEach(k=>{ const r=S.places[k];
    if(r&&Array.isArray(r.photos)) r.photos.forEach(p=>set.add(p)); });
  return set;
}
// Pictures left behind by an opened file or a discarded atlas would otherwise
// hold on to the quota forever.
function sweepPhotos(){
  const used=usedPhotoIds();
  const dead=[...PIX.keys()].filter(k=>!used.has(k));
  dead.forEach(k=>PIX.delete(k));
  if(noDB||!dead.length) return Promise.resolve();
  return Promise.all(dead.map(k=>idbDel(PH,k).catch(e=>console.error(e))));
}
/* Photos arriving inline — from a save file, or from the old localStorage
   record — are moved into the photo store and replaced by their ids. Ids that
   name a picture the store does not have are left alone rather than dropped:
   the record is worth more than the tidiness, and the gaps are shown as such. */
function adoptInline(){
  const jobs=[];
  Object.keys(S.places).forEach(k=>{
    const r=S.places[k];
    if(!r||!Array.isArray(r.photos)) return;
    r.photos=r.photos.filter(p=>typeof p==='string'&&p).map(p=>{
      if(p.slice(0,5)!=='data:') return p;
      const id=newPhotoId();
      PIX.set(id,p);
      if(!noDB) jobs.push(idbPut(PH,id,p).catch(e=>{console.error(e);}));
      return id;
    });
    if(!r.photos.length){ delete r.photos; delete r.cover; }
  });
  return Promise.all(jobs);
}

/* Writes coalesce: a burst of edits produces one write after the one in flight
   finishes, and a failure is reported once rather than on every keystroke. */
let saving=false, dirty=false, saveFailed=false;
function save(){
  if(noDB){ saveLocal(); return; }
  dirty=true;
  if(saving) return;
  saving=true;
  (function run(){
    if(!dirty){ saving=false; return; }
    dirty=false;
    idbPut(ST,STATE_KEY,stateRecord())
      .then(()=>{ if(saveFailed){ saveFailed=false; toast('Saving again'); } run(); })
      .catch(e=>{ saving=false; console.error(e);
        if(!saveFailed){ saveFailed=true; toast('Could not save — storage may be full'); } });
  })();
}
// The internal record: identical to a save file except that photos are named
// rather than carried, which keeps it small enough to rewrite on every edit.
function stateRecord(){
  return {format:'atlas-save',version:SAVE_VERSION,app:APP_VERSION,byref:true,
    name:S.name,tagline:S.tagline,
    scales:S.scales,territories:writeTerr(),sites:S.sites.map(outSite),
    progress:{countries:S.countries,places:S.places,own:S.own.map(outOwn)}};
}
function saveLocal(){
  try{ localStorage.setItem(KEY,JSON.stringify(writeSave())); saveFailed=false; }
  catch(e){ if(!saveFailed){ saveFailed=true;
    toast('Storage full — save to a file, then remove a photo'); } }
}
const rec=id=>S.places[id]||(S.places[id]={});

// Without this a browser is free to clear the atlas to reclaim space. It is a
// request, not a guarantee, which is why the overview still nags about files.
function askPersistence(){
  if(!navigator.storage||!navigator.storage.persist) return;
  navigator.storage.persisted().then(p=>p||navigator.storage.persist()).catch(()=>{});
}

function boot(){
  return openDB().then(d=>{db=d;})
    .catch(e=>{ noDB=true; console.warn('IndexedDB unavailable, falling back to localStorage',e); })
    .then(()=>noDB?null:loadPhotos().then(()=>idbGet(ST,STATE_KEY)).catch(e=>{
      noDB=true; console.warn('database unreadable, falling back to localStorage',e); return null; }))
    .then(saved=>{
      if(saved){ try{ S=readSave(saved); }catch(e){ console.error(e); S=blank(); }
        return adoptInline(); }
      // nothing stored yet: take over whatever the old localStorage record holds
      let raw=null;
      try{ raw=localStorage.getItem(KEY); }catch(e){}
      if(!raw) return adoptInline();
      try{ S=readSave(JSON.parse(raw)); }catch(e){ console.error(e); S=blank(); }
      return adoptInline().then(()=>{
        if(noDB) return;
        return idbPut(ST,STATE_KEY,stateRecord())
          .then(()=>{ try{ localStorage.removeItem(KEY); }catch(e){} })
          .catch(e=>console.error(e));
      });
    })
    .then(askPersistence)
    .catch(e=>{ console.error(e); S=blank(); });
}

/* ---------- map ---------- */
const svg=d3.select('#map'), wrap=document.getElementById('mapwrap');
const gRoot=svg.append('g'), gGrat=gRoot.append('g'), gLand=gRoot.append('g'), gSites=gRoot.append('g');
const proj=d3.geoNaturalEarth1(), path=d3.geoPath(proj);
/* A selection names a country and a site at once rather than one or the other:
   opening a site lights up the territory holding it, and picking a territory
   keeps its own marking while you work through the sites inside. */
let features=[], byName=new Map(), byId=new Map(), sel={country:null,site:null},
    k=1, W=0, H=0, pickMode=false;
// Every save writes a line per territory, so this lookup runs often enough to
// be worth a map rather than a scan.
const featureOf=fid=>byId.get(String(fid))||null;
const hasSel=()=>!!(sel.country||sel.site);
const clearSel=()=>{ sel={country:null,site:null}; };
const allSites=()=>S.sites.concat(S.own);
const isDone=id=>!!(S.places[id]&&S.places[id].visited);

// A double tap on open water clears the selection, so the zoom behaviour has to
// keep its hands off that one gesture. Everything else filters as d3 does by default.
const onBlank=t=>!(t&&t.closest&&t.closest('.country,.site'));
const zoom=d3.zoom().scaleExtent([1,14])
  .filter(ev=>ev.type==='dblclick'&&onBlank(ev.target)
    ?false
    :(!ev.ctrlKey||ev.type==='wheel')&&!ev.button)
  .on('zoom',ev=>{
    k=ev.transform.k; gRoot.attr('transform',ev.transform); resizeMarks();
  });
svg.call(zoom).on('mousedown',()=>svg.classed('grabbing',true))
   .on('mouseup',()=>svg.classed('grabbing',false))
   .on('dblclick.deselect',ev=>{
     if(pickMode||!onBlank(ev.target)) return;
     ev.preventDefault(); dismiss();
   });

/* On touch, d3 runs its own double-tap-to-zoom off touchstart rather than off a
   dblclick event, so the filter above never sees it and a listener on the svg
   would arrive too late. Catching it on the wrapper during capture stops the
   second tap before the zoom behaviour is reached. */
let tapAt=0, tapX=0, tapY=0;
wrap.addEventListener('touchstart',ev=>{
  if(pickMode||ev.touches.length!==1){ tapAt=0; return; }
  const t=ev.touches[0], now=Date.now(), blank=onBlank(ev.target);
  if(blank&&now-tapAt<350&&Math.abs(t.clientX-tapX)<32&&Math.abs(t.clientY-tapY)<32){
    tapAt=0;
    ev.stopPropagation(); ev.preventDefault();
    dismiss();
    return;
  }
  tapAt=blank?now:0; tapX=t.clientX; tapY=t.clientY;
},{capture:true,passive:false});

function layout(){
  W=wrap.clientWidth; H=wrap.clientHeight;
  svg.attr('viewBox',[0,0,W,H]);
  proj.fitExtent([[10,10],[W-10,H-10]],{type:'Sphere'});
  gGrat.selectAll('path').attr('d',path);
  gLand.selectAll('path').attr('d',path);
  resizeMarks();
}
function resizeMarks(){
  gSites.selectAll('.site').attr('transform',d=>{
    if(d.lat==null||d.lng==null) return 'translate(-99,-99)';
    const p=proj([d.lng,d.lat]); return p?`translate(${p[0]},${p[1]}) scale(${1/k})`:'translate(-99,-99)';
  });
  gGrat.attr('stroke-width',0.5/k);
}

boot().then(()=>d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')).then(topo=>{
  features=topojson.feature(topo,topo.objects.countries).features;
  nameFeatures();
  features.forEach(f=>byName.set(norm(f.properties.name),f));

  gGrat.append('path').datum(d3.geoGraticule10()).attr('fill','none')
    .attr('stroke','#5fe0d8').attr('stroke-opacity',.07);
  gGrat.append('path').datum({type:'Sphere'}).attr('fill','none')
    .attr('stroke','#2a353c').attr('stroke-width',1);

  gLand.selectAll('path').data(features).join('path')
    .attr('class','country').attr('d',path)
    .on('click',(ev,d)=>{ if(pickMode) return; ev.stopPropagation(); selectCountry(String(d.id)); })
    .on('mousemove',(ev,d)=>showTip(ev,d.properties.name,countSites(String(d.id)),'',tipScales(null,String(d.id))))
    .on('mouseleave',hideTip);

  svg.on('click',ev=>{
    if(!pickMode) return;
    const [x,y]=d3.pointer(ev,gRoot.node()), c=proj.invert([x,y]);
    if(c) setPick(c[1],c[0]);
  });

  resolveSites(); layout(); drawSites(); paint(); brand(); renderOverview();
  window.addEventListener('resize',layout);
}).catch(e=>{
  document.getElementById('pbody').innerHTML=
    '<p class="empty">Map geometry could not be loaded. Reconnect and reload.</p>';
  console.error(e);
});

/* Natural Earth gives no ISO number to the territories it does not treat as
   states, so world-atlas hands N. Cyprus, Somaliland and Kosovo the very same
   undefined id. Every lookup here keys off that id, which made the three behave
   as one country: marking any of them visited marked all three, selecting one
   selected the others, and their sites piled onto a single page. Give anything
   the dataset leaves unnumbered a stable id of our own, derived from its name
   so it survives a reload and matches what earlier saves will resolve to. */
function nameFeatures(){
  const seen=new Set();
  features.forEach(f=>{
    let id=f.id==null?'':String(f.id);
    if(!id||id==='undefined'||id==='null') id='x-'+(slug(f.properties&&f.properties.name)||'unnamed');
    while(seen.has(id)) id+='-2';
    seen.add(id);
    f.id=id;
  });
  byId=new Map(features.map(f=>[String(f.id),f]));
}
function lookup(name){
  const n=norm(name);
  if(!n) return null;
  if(byName.has(n)) return byName.get(n);
  for(const [k2,list] of Object.entries(ALIAS)){
    if(k2===n||list.includes(n)){ if(byName.has(k2)) return byName.get(k2);
      for(const a of list) if(byName.has(a)) return byName.get(a); }
  }
  for(const [fn,f] of byName) if(fn.includes(n)||n.includes(fn)) return f;
  return null;
}
// Runs again after every load, so a catalogue opened long after the map is ready
// still gets bound to territories.
function resolveSites(){
  if(!features.length) return;
  const unresolved=[];
  const known=new Set(features.map(f=>String(f.id)));
  allSites().forEach(s=>{
    const f=lookup(s.country);
    if(f){ s.fid=String(f.id); s.cname=f.properties.name; }
    // a reference the dataset no longer answers to is worse than none: it would
    // strand the site on a country page that can never be reached
    else{ if(!known.has(fidOf(s.fid))) s.fid=null;
      if(!s.fid&&s.country) unresolved.push(s.country); }
  });
  if(unresolved.length) console.warn('unresolved countries',[...new Set(unresolved)]);
  resolveTerr();
}

/* ---------- scale values ---------- */
const scaleFor=key=>S.scales.find(m=>m.key===key)||null;
const siteScales=()=>S.scales.filter(m=>m.scope!=='country');
const countryScales=()=>S.scales.filter(m=>m.scope!=='site');
const levelName=(m,v)=>(m.levels&&m.levels[v-m.min])||'';
const levelText=(m,v)=>v+'/'+m.max+(levelName(m,v)?' · '+levelName(m,v):'');
// A value outside the scale is shown where it sits rather than hidden: the scale
// may have been narrowed after the number was set.
const sval=(s,key)=>(s&&s.values&&Number.isFinite(s.values[key]))?s.values[key]:null;
function setSval(s,key,v){
  if(!s) return;
  const vals=s.values||(s.values={});
  if(v==null) delete vals[key]; else vals[key]=v;
  save();
}
const tval=(fid,key)=>{ const m=S.terr[fid]; return (m&&Number.isFinite(m[key]))?m[key]:null; };
function setTval(fid,key,v){
  const m=S.terr[fid]||(S.terr[fid]={});
  if(v==null) delete m[key]; else m[key]=v;
  if(!Object.keys(m).length) delete S.terr[fid];
  save();
}
// Past the halfway mark a scale reads as a warning rather than a score, and the
// difficulty of a place is the thing you most want to see at a glance.
const hotAt=m=>m.min+(m.max-m.min)*0.6;
function pips(m,v,cls){
  if(v==null) return '';
  let out='';
  for(let i=m.min;i<=m.max;i++) out+=`<i class="${i<=v?'on':''}"></i>`;
  return `<span class="${cls||'pips'} ${v>=hotAt(m)?'hot':''}" title="${esc(m.label+' — '+levelText(m,v))}">${out}</span>`;
}
/* The control for one value: a step per point, and a way back to unset. */
function scaleRow(m,v,attr){
  let steps='';
  for(let i=m.min;i<=m.max;i++)
    steps+=`<button class="step ${v===i?'on':''}" ${attr} data-set="${i}"`
      +` title="${esc(levelName(m,i)||m.label+' '+i)}">${i}</button>`;
  return `<div class="scale">
    <div class="scalehead"><span class="fieldlabel" style="margin:0">${esc(m.label)}</span>
      <span class="scaleval ${v==null?'off':''}">${v==null?'Not set':esc(levelText(m,v))}</span></div>
    <div class="steps">${steps}<button class="step clear" ${attr} data-set="" title="Clear">–</button></div>
  </div>`;
}
// Every step button in the panel, wherever it was drawn, writes its value and
// redraws — the number shows in the gallery and the tooltip as well as here.
function wireScales(after){
  pbody.querySelectorAll('.step[data-scale]').forEach(b=>{
    b.onclick=ev=>{
      ev.stopPropagation();
      const key=b.dataset.scale, raw=b.dataset.set, v=raw===''?null:+raw;
      if(b.dataset.terr!==undefined) setTval(b.dataset.terr,key,v);
      else{
        const s=allSites().find(x=>x.id===b.dataset.site);
        if(!s) return;
        setSval(s,key,v);
      }
      if(after) after(b);
    };
  });
}
function drawSites(){
  const g=gSites.selectAll('.site').data(allSites(),d=>d.id);
  g.exit().remove();
  const e=g.enter().append('g').attr('class','site')
    .on('click',(ev,d)=>{ ev.stopPropagation(); selectSite(d); })
    .on('mousemove',(ev,d)=>showTip(ev,d.name,-1,d.cname||d.country,tipScales(d,null)))
    .on('mouseleave',hideTip);
  e.append('circle').attr('class','halo').attr('r',9);
  e.append('circle').attr('r',4.2);
  resizeMarks(); paintSites();
}
function paint(){
  gLand.selectAll('path')
    .classed('visited',d=>!!S.countries[d.id])
    .classed('sel',d=>sel.country===String(d.id));
  paintSites(); stats();
}
function paintSites(){
  gSites.selectAll('.site')
    .classed('done',d=>isDone(d.id))
    .classed('own',d=>!!d.own)
    .classed('sel',d=>sel.site===d.id)
    // the pulsing marker has to sit above its neighbours to read as the one picked
    .filter(d=>sel.site===d.id).raise();
}
function countSites(fid){ return allSites().filter(s=>s.fid===fid).length; }
function doneIn(fid){ return allSites().filter(s=>s.fid===fid&&isDone(s.id)).length; }

/* ---------- tooltip ---------- */
const tip=document.getElementById('tip');
function showTip(ev,name,n,sub,extra){
  const r=wrap.getBoundingClientRect();
  tip.style.left=(ev.clientX-r.left)+'px'; tip.style.top=(ev.clientY-r.top)+'px';
  tip.innerHTML=esc(name)+(n>0?` <small>· ${n} site${n>1?'s':''}</small>`:'')
    +(sub?` <small>· ${esc(sub)}</small>`:'')+(extra||'');
  tip.style.opacity=1;
}
// What a place scores, short enough to sit in a tooltip.
function tipScales(site,fid){
  const list=site?siteScales():countryScales();
  return list.map(m=>{
    const v=site?sval(site,m.key):tval(fid,m.key);
    return v==null?'':` <small>· ${esc(m.label)} ${esc(levelText(m,v))}</small>`;
  }).join('');
}
function hideTip(){ tip.style.opacity=0; }

function flyTo(fid){
  const f=featureOf(fid); if(!f) return;
  const b=path.bounds(f), dx=b[1][0]-b[0][0], dy=b[1][1]-b[0][1];
  const kk=Math.max(1,Math.min(8,.6/Math.max(dx/W,dy/H)));
  const cx=(b[0][0]+b[1][0])/2, cy=(b[0][1]+b[1][1])/2;
  svg.transition().duration(700).call(zoom.transform,
    d3.zoomIdentity.translate(W/2,H/2).scale(kk).translate(-cx,-cy));
}

/* A single history entry stands for "something is open". Android's back button
   pops it and we dismiss the selection instead of leaving the app; dismissing
   from the UI pops the entry itself, so the two never drift apart. Only one is
   ever outstanding, so switching between countries does not stack up entries. */
let navPushed=false;
function markNav(){
  if(navPushed) return;
  if(!hasSel()&&!isPhone()) return;   // on desktop the overview is the resting state
  try{ history.pushState({atlas:1},''); navPushed=true; }catch(e){}
}
function releaseNav(){
  if(!navPushed) return;
  navPushed=false;
  try{ history.back(); }catch(e){}
}
function dismiss(fromPop){
  closeLightbox(); clearSel(); paint(); renderOverview();
  if(isPhone()) panel.classList.remove('open','tall');
  if(fromPop) navPushed=false; else releaseNav();
}
window.addEventListener('popstate',()=>{
  const open=hasSel()||(isPhone()&&panel.classList.contains('open'));
  navPushed=false;
  // a photo viewer is the innermost thing open: back closes it and nothing else,
  // so the entry it consumed is put straight back
  if(lbOpen()){ closeLightbox(); markNav(); return; }
  if(open) dismiss(true);
});

// slug ids contain '/', which is not valid inside an element id used with
// getElementById lookups built by concatenation — swap it for a safe token

/* One scale as the overview shows it: a name you can change, and — for anything
   that applies to sites — how far through each level you are. The breakdown is
   the point of a scale at atlas level: it says which of the easy ones are still
   outstanding, and how much of the hard end you have actually done. */
function scaleStat(m){
  const scope=m.scope==='site'?'Sites only':m.scope==='country'?'Territories only':'Sites and territories';
  let rows='';
  if(m.scope!=='country'){
    const sites=allSites();
    for(let i=m.min;i<=m.max;i++){
      const at=sites.filter(s=>sval(s,m.key)===i);
      if(!at.length) continue;
      const dn=at.filter(s=>isDone(s.id)).length;
      rows+=`<div class="lvlrow"><span class="lvln">${esc(levelName(m,i)||('Level '+i))}</span>
        <span class="lvlbar"><i style="width:${(dn/at.length*100).toFixed(1)}%"></i></span>
        <em>${dn}/${at.length}</em></div>`;
    }
    const unset=sites.filter(s=>sval(s,m.key)==null).length;
    if(unset&&sites.length) rows+=`<div class="lvlrow"><span class="lvln">Not set</span>
      <span class="lvlbar"></span><em>${unset}</em></div>`;
  }
  return `<div class="scaledef">
      <input data-screname="${esc(m.key)}" value="${esc(m.label)}" aria-label="Scale name">
      <span class="tiny">${m.min}–${m.max}</span>
      <button data-scdrop="${esc(m.key)}" title="Remove this scale">×</button>
    </div>
    <p class="tiny" style="margin:5px 0 1px">${scope}</p>
    ${rows}`;
}
function wireScaleForm(){
  pbody.querySelectorAll('[data-screname]').forEach(inp=>{
    inp.onchange=inp.onblur=()=>{
      const m=scaleFor(inp.dataset.screname);
      if(!m) return;
      const v=inp.value.trim();
      if(!v){ inp.value=m.label; return; }   // a scale with no name cannot be read anywhere
      m.label=v; save();
    };
  });
  // The values stay behind on purpose: a scale removed by mistake, then added
  // back under the same name, finds every number it had.
  pbody.querySelectorAll('[data-scdrop]').forEach(b=>{
    b.onclick=()=>{
      const m=scaleFor(b.dataset.scdrop);
      if(!m||!confirm('Remove the “'+m.label+'” scale? The numbers already recorded are kept, and return if you add it back.')) return;
      S.scales=S.scales.filter(x=>x.key!==m.key);
      save(); renderOverview(); toast('Scale removed');
    };
  });
  const form=document.getElementById('sc-form'), add=document.getElementById('sc-add');
  if(add) add.onclick=()=>{ form.classList.add('open'); document.getElementById('sc-label').focus(); };
  document.getElementById('sc-cancel').onclick=()=>form.classList.remove('open');
  document.getElementById('sc-save').onclick=()=>{
    const label=document.getElementById('sc-label').value.trim();
    if(!label){ toast('A name is required'); return; }
    const one=readScales([{key:label,label:label,min:1,
      max:+document.getElementById('sc-max').value,
      scope:document.getElementById('sc-scope').value,
      levels:document.getElementById('sc-levels').value.split(',').map(x=>x.trim()).filter(Boolean)}])[0];
    if(!one){ toast('That name cannot be used'); return; }
    if(scaleFor(one.key)){ toast('A scale by that name already exists'); return; }
    S.scales.push(one); save(); renderOverview(); toast('Scale added');
  };
}

const mb=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
// Photos are the only thing here big enough to matter, so the count travels
// with the figure — it is the number you act on when space runs low.
function showUsage(){
  const line=document.getElementById('a-usage'), bar=document.getElementById('a-meter');
  if(!line) return;
  const shots=[...usedPhotoIds()].filter(id=>pix(id)).length;
  const done=(used,quota)=>{
    const el=document.getElementById('a-usage'); if(!el) return;
    el.textContent=`${shots} photo${shots===1?'':'s'}`
      +(used?` · ${mb(used)} used`:'')+(quota?` of ${mb(quota)} available`:'');
    const b=document.getElementById('a-meter');
    if(b&&quota){ const p=Math.min(100,used/quota*100);
      b.style.width=Math.max(p,used?.6:0).toFixed(2)+'%'; b.classList.toggle('hot',p>80); }
  };
  line.textContent=`${shots} photo${shots===1?'':'s'} · measuring…`;
  if(bar) bar.style.width='0';
  if(navigator.storage&&navigator.storage.estimate){
    navigator.storage.estimate().then(r=>done(r.usage||0,r.quota||0)).catch(()=>done(0,0));
  } else done(0,0);
}

/* ---------- every site on file ----------
   The map answers "what is near here" and a country answers "what is in here";
   this answers "what have I got", in one scrolling sheet led by the pictures.
   The search text and filter survive a redraw, so attaching or removing a photo
   from here leaves you where you were. */
let galQ='', galF='all', galSort='country', galLvl='';
const GAL_FILTERS=[['all','All'],['done','Visited'],['todo','Not yet'],['pix','With photos'],['own','Mine']];
function galMatch(s){
  if(galF==='done'&&!isDone(s.id)) return false;
  if(galF==='todo'&&isDone(s.id)) return false;
  if(galF==='pix'&&!photoCount(s.id)) return false;
  if(galF==='own'&&!s.own) return false;
  if(galLvl){
    const cut=galLvl.split(':'), v=sval(s,cut[0]);
    if(cut[1]==='none'){ if(v!=null) return false; }
    else if(v!==+cut[1]) return false;
  }
  const q=galQ.trim().toLowerCase();
  if(!q) return true;
  return (s.name+' '+(s.cname||s.country)+' '+(s.hook||'')).toLowerCase().indexOf(q)>=0;
}
const byCountryThenName=(a,b)=>
  (a.cname||a.country||'~').localeCompare(b.cname||b.country||'~')||a.name.localeCompare(b.name);
/* Sorting by a scale puts the unrated last whichever way the order runs — they
   are not a low score, they are an absence, and burying them keeps both ends of
   the list meaningful. */
function galSorted(all){
  if(galSort==='name') return all.sort((a,b)=>a.name.localeCompare(b.name));
  if(galSort==='visited') return all.sort((a,b)=>(isDone(b.id)-isDone(a.id))||byCountryThenName(a,b));
  const cut=galSort.split(':'), m=scaleFor(cut[0]);
  if(!m) return all.sort(byCountryThenName);
  return all.sort((a,b)=>{
    const x=sval(a,m.key), y=sval(b,m.key);
    if(x==null||y==null) return x==null&&y==null?byCountryThenName(a,b):(x==null?1:-1);
    return (cut[1]==='desc'?y-x:x-y)||byCountryThenName(a,b);
  });
}
function galSortOptions(){
  let out=[['country','Country'],['name','Name'],['visited','Visited first']];
  siteScales().forEach(m=>{
    out.push([m.key+':asc',m.label+' — low first'],[m.key+':desc',m.label+' — high first']);
  });
  return out.map(([v,l])=>`<option value="${esc(v)}" ${galSort===v?'selected':''}>${esc(l)}</option>`).join('');
}
function galLevelOptions(){
  let out=`<option value="" ${galLvl?'':'selected'}>Any level</option>`;
  siteScales().forEach(m=>{
    for(let i=m.min;i<=m.max;i++){
      const v=m.key+':'+i;
      out+=`<option value="${esc(v)}" ${galLvl===v?'selected':''}>${esc(m.label+' '+levelText(m,i))}</option>`;
    }
    out+=`<option value="${esc(m.key)}:none" ${galLvl===m.key+':none'?'selected':''}>${esc(m.label)} — not set</option>`;
  });
  return out;
}
function renderSites(){
  curView={kind:'sites',fid:null};
  kicker.textContent='All sites'; back.style.display='inline-block'; hlabel.textContent='All sites';
  // a scale removed while its filter was on would otherwise empty the list
  if(galLvl&&!scaleFor(galLvl.split(':')[0])) galLvl='';
  if(galSort.indexOf(':')>0&&!scaleFor(galSort.split(':')[0])) galSort='country';
  const all=galSorted(allSites().slice());
  const list=all.filter(galMatch);
  const shots=all.reduce((n,s)=>n+photoCount(s.id),0);
  const scaled=siteScales().length;
  pbody.innerHTML=`
    <h2 class="dossier">All sites</h2>
    <div class="meta">${all.length} on file · ${all.filter(s=>isDone(s.id)).length} visited · ${shots} photo${shots===1?'':'s'}</div>
    <div class="galbar"><input id="g-q" placeholder="Search name, country or hook" value="${esc(galQ)}"></div>
    ${scaled?`<div class="two3">
      <label><span class="fieldlabel">Sort by</span><select id="g-sort">${galSortOptions()}</select></label>
      <label><span class="fieldlabel">Level</span><select id="g-lvl">${galLevelOptions()}</select></label>
    </div>`:''}
    <div class="chips">${GAL_FILTERS.map(([k2,label])=>
      `<button class="chip ${galF===k2?'on':''}" data-filter="${k2}">${label}</button>`).join('')}</div>
    ${!all.length?'<p class="empty">No sites yet. Select a territory on the map to add the first one, or open a save file you already have.</p>'
      :!list.length?'<p class="empty">Nothing matches that. Clear the search or pick another filter.</p>'
      :`<div class="gal">${list.map(galCard).join('')}</div>`}`;

  // Typing rebuilds the list, so the field has to be handed back exactly as it
  // was — caret included, or editing mid-word throws you to the end.
  const q=document.getElementById('g-q');
  q.oninput=()=>{
    const at=q.selectionStart, y=pbody.scrollTop;
    galQ=q.value;
    renderSites();
    pbody.scrollTop=y;
    const el=document.getElementById('g-q');
    el.focus();
    try{ el.setSelectionRange(at,at); }catch(e){}
  };
  pbody.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{
    galF=b.dataset.filter; renderSites(); pbody.scrollTop=0; });
  const sortSel=document.getElementById('g-sort'), lvlSel=document.getElementById('g-lvl');
  if(sortSel) sortSel.onchange=()=>{ galSort=sortSel.value; renderSites(); pbody.scrollTop=0; };
  if(lvlSel) lvlSel.onchange=()=>{ galLvl=lvlSel.value; renderSites(); pbody.scrollTop=0; };
  pbody.querySelectorAll('.galcard').forEach(el=>{
    el.onclick=ev=>{
      const s=allSites().find(x=>x.id===el.dataset.site); if(!s) return;
      // tapping the picture opens the picture; anywhere else opens the site
      if(ev.target.dataset.view!==undefined) openLightbox(s.id,+ev.target.dataset.view);
      else selectSite(s);
    };
  });
}
function galCard(s){
  const cover=coverSrc(s.id), n=photoCount(s.id), ci=coverIdx(s.id), done=isDone(s.id);
  // the leading scale rides on the picture, where it reads without stealing a line
  const lead=siteScales()[0], lv=lead?sval(s,lead.key):null;
  return `<figure class="galcard ${done?'done':''} ${sel.site===s.id?'sel':''}" data-site="${esc(s.id)}">
    <div class="galshot">
      ${cover?`<img src="${esc(cover)}" alt="${esc(s.name)}" loading="lazy" data-view="${ci}">`
             :'<span class="galnone">No photo</span>'}
      ${done?`<b class="galtick ${s.own?'own':''}">✓</b>`:''}
      ${n>1?`<b class="galcount">${n} photos</b>`:''}
      ${lv==null?'':pips(lead,lv,'scaletag')}
    </div>
    <figcaption class="galcap">
      <span class="galname">${esc(s.name)}</span>
      <span class="galsub">${esc(s.cname||s.country||'Unplaced')}</span>
      ${lv==null?'':`<span class="galtag">${esc(levelName(lead,lv)||lead.label+' '+lv)}</span>`}
    </figcaption></figure>`;
}

// What a site scores, for the head of a card that may well be shut.
function scaleTags(s){

    return v==null?'':`<span class="galtag" style="margin-top:4px">${pips(m,v)}
      ${esc(levelName(m,v)||m.label+' '+v)}</span>`;
  }).filter(Boolean);

}
function card(s){
  const r=S.places[s.id]||{}, cid=cssId(s.id), sid=esc(s.id);

  // rest along, so nothing else in the record silently changes meaning.
  const grid=n?`<div class="photos">${ph.map((p,i)=>{const d=pix(p);
        return `<figure class="${i===ci?'main':''}">
          ${d?`<img src="${esc(d)}" alt="" data-view="${i}" data-site="${sid}">`
             :'<span class="missing">Picture<br>unavailable</span>'}
          ${i===ci&&d?'<b class="badge">Main</b>':''}

      ${siteScales().map(m=>scaleRow(m,sval(s,m.key),
